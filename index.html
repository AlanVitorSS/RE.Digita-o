                text: "O Código Civil de 2002 promoveu uma profunda virada paradigmática no Direito Contratual brasileiro ao afastar- se do modelo excessivamente individualista e voluntarista do diploma de 1916. Sob a égide da Carta Magna de 1988 e da diretriz da eticidade, a autonomia privada deixou de ser encarada como um valor absoluto para ser relida à luz da função social do contrato (art. 421 do Código Civil) e da boa-fé objetiva (art. 422). Esse movimento não visou aniquilar a liberdade de pactuar, mas sim compatibilizá-la com a justiça distributiva e a solidariedade social. A função social do contrato opera em duas dimensões precípuas: a interna e a externa. Em sua dimensão interna, ela impõe limites às cláusulas abusivas, assegura o equilíbrio socioeconômico das prestações e protege o contraente vulnerável contra termos opressivos. Proíbe-se, assim, a celebração de avenças que resultem na degradação da dignidade humana de uma das partes. Já em sua dimensão externa, a função social reflete o dever do contrato de não gerar prejuízos desarrazoados a terceiros, bem como o dever da coletividade de respeitar os contratos validamente celebrados, surgindo daí institutos como a tutela externa do crédito e a proibição da aliciação de trabalhadores. Paralelamente, a boa-fé objetiva consagra-se como regra de conduta fundada na lealdade, na transparência, na cooperação e na confiança mútua. Distinta da boa-fé subjetiva — que diz respeito ao estado psicológico de ignorância sobre um vício —, a boa-fé objetiva constitui um padrão ético comportamental exigível dos contratantes em todas as fases da relação jurídica: desde as negociações pré-contratuais (fase punctctação), passando pela execução do pacto, até o momento pós-contratual. Do princípio da boa-fé objetiva decorrem três funções essenciais reconhecidas pela doutrina e pela jurisprudência do Superior Tribunal de Justiça (STJ). A primeira é a função interpretativa, servindo como vetor hermenêutico para o cumprimento das obrigações da maneira mais justa e leal. A segunda é a função de controle, impondo limites ao exercício de direitos subjetivos a fim de evitar o abuso de direito (art. 187 do Código Civil). Por fim, a terceira é a função de integração, sendo responsável por criar deveres anexos ou laterais ao dever principal de prestação. Esses deveres anexos não precisam estar expressamente redigidos na avença, pois decorrem diretamente do padrão ético exigido pela norma legal. Entre eles, destacam-se: o dever de informação e esclarecimento, o dever de proteção e segurança, o dever de sigilo e a obrigação de cooperação para o alcance das finalidades do negócio. A violação desses deveres transversais gera o que a doutrina convencionou chamar de \"violação positiva do contrato\", a qual gera responsabilidade civil objetiva, prescindindo da verificação de culpa ou dolo por parte do devedor. Além disso, a boa-fé objetiva serve de gérmen para figuras dogmáticas consagradas, como a proibição do venire contra factum proprium (vedação ao comportamento contraditório), a supressio (perda de um direito pela sua falta de exercício prolongado) e a surrectio (surgimento de um direito pelo costume normativo contratual). Em síntese, a atuação conjunta da função social e da boa-fé reconfigura a relação contratual como uma comunidade de cooperação, na qual os interesses particulares devem harmonizar-se com a ordem constitucional."

                text: "O Direito Penal, orientado pelos princípios da intervenção mínima e da ultima ratio, deve ser acionado tão somente para a proteção dos bens jurídicos mais relevantes ante as lesões mais graves. É nesse contexto que se insere o princípio da insignificância (ou bagatela), construção doutrinária e jurisprudencial que visa afastar a incidência da sanção penal quando a conduta praticada, embora formalmente típica, não promove um dano relevante à ordem social ou ao bem protegido pelo tipo penal. A análise da tipicidade penal moderna desdobra-se em duas dimensão indissociáveis: a tipicidade formal e a tipicidade material. A tipicidade formal expressa a perfeita subsunção do fato empírico à norma abstrata descrita na lei penal. Por sua vez, a tipicidade material exige que a conduta cause uma lesão ou ameaça de lesão efetiva e juridicamente relevante ao bem tutelado. O princípio da insignificância atua exatamente como causa de exclusão da tipicidade material. Sem a lesão expressiva ao bem jurídico, a conduta torna-se penalmente atípica, ensejando o trancamento da ação penal ou a absolvição sumária do réu. O Supremo Tribunal Federal (STF) construiu balizas objetivas para a aplicação do referido instituto, exigindo a presença cumulativa de quatro vetores fundamentais: a) mínima ofensividade da conduta do agente; b) nenhuma periculosidade social da ação; c) reduzidíssimo grau de reprovabilidade do comportamento; e d) inexpressividade da lesão jurídica provocada. A ausência de qualquer um desses elementos afasta a incidência da insignificância, mantendo hígida a persecução penal estatal. A aplicação prática desses vetores exige um exame meticuloso do caso concreto, haja vista que a análise puramente econômica do valor da res furtiva não é bastante. Embora a jurisprudência adote como parâmetro teto o valor equivalente a 10% do salário mínimo para aferir a pequenez da lesão material, aspectos subjetivos e circunstanciais da conduta exercem peso determinante. Por exemplo, a prática de furto qualificado por rompimento de obstáculo, mediante escalada ou em concurso de pessoas, costumeiramente obsta a bagatela devido à maior reprovabilidade da conduta. Questão de intenso debate jurisprudencial diz respeito à incidência do princípio aos criminosos reincidentes ou habituais. O Superior Tribunal de Justiça (STJ) firmou o entendimento de que a reincidência, por si só, não impede de forma absoluta o reconhecimento da insignificância, desde que as circunstâncias do fato indiquem que a medida é socialmente recomendável. Todavia, a habitualidade delitiva presumida demonstra um desvalor da conduta que repele a indulgência do Estado. Impende destacar, ainda, que o princípio da insignificância encontra vedações expressas em determinados ramos do Direito Penal. É inaplicável aos crimes cometidos com violência ou grave ameaça à pessoa (como o roubo), aos crimes contra a administração pública (Súmula 599 do STJ, ressalvadas hipóteses pontuais no descaminho), ao tráfico de drogas e aos ilícitos praticados no âmbito da violência doméstica e familiar contra a mulher (Súmula 589 do STJ). Conclui-se que o princípio funciona como valioso instrumento de política criminal, evitando que o aparato judicial seja mobilizado para punir condutas irrelevantes, assegurando maior eficiência ao sistema de justiça."

                text: "A consolidação das tecnologias da informação e a aceleração provocada pela pandemia de COVID-19 alteraram profundamente a organização do trabalho, guindando o teletrabalho (ou home office) à condição de modalidade contratual de extrema relevância no mercado contemporâneo. No ordenamento trabalhista brasileiro, o instituto foi formalmente regrado pela Reforma Trabalhista (Lei nº 13.467/2017) e posteriormente aprimorado pela Lei nº 14.442/2022, que inseriram e alteraram dispositivos na Consolidação das Leis do Trabalho (CLT), em especial nos artigos 75-A e seguintes. Conforme conceitua o art. 75-B da CLT, considera-se teletrabalho ou trabalho remoto a prestação de serviços fora das dependências do empregador, de maneira preponderante ou não, com a utilização de tecnologias de informação e comunicação que, por sua natureza, não se configurem como trabalho externo. A legislação inovou ao explicitar que o comparecimento pontual às dependências da empresa para a realização de atividades específicas não descaracteriza o regime de teletrabalho, consolidando também o modelo híbrido de prestação laboral. Um dos pontos centrais da discussão jurídica envolve o poder diretivo e fiscalizatório do empregador em contraposição aos direitos da personalidade do trabalhador, nomeadamente a intimidade, a privacidade e a inviolabilidade do lar (art. 5º, X e XI, da CF/88). Embora o empregador mantenha o direito de monitorar as entregas e a produtividade, a implementação de softwares invasivos de rastreamento contínuo da tela do computador, acionamento ininterrupto da câmera fotográfica ou captação de áudio sem consentimento viola os preceitos éticos e legais do contrato de trabalho, sujeitando a empresa à reparação por danos morais. No tocante à jornada de trabalho, a disciplina sofreu importante inflexão legislativa. Inicialmente, o teletrabalhador estava sumariamente excluído do Capítulo de Duração do Trabalho (art. 62, III, da CLT), não fazendo jus às horas extraordinárias. No entanto, com o advento da Lei nº 14.442/2022, estabeleceu-se uma distinção crucial: apenas os empregados em teletrabalho contratados por produção ou tarefa estão excluídos do controle de jornada. Quando a contratação for por disposição de tempo (por jornada), o controle de horário é obrigatório, sendo devido o pagamento de horas extras caso ultrapassados os limites constitucionais de 8 horas diárias e 44 horas semanais. Outro aspecto de relevante atrito contratual refere-se ao custeio da infraestrutura necessária para o trabalho remoto. O art. 75-D da CLT prescreve que as disposições relativas à aquisição, manutenção ou fornecimento dos equipamentos tecnológicos e da infraestrutura adequada, bem como ao reembolso de despesas arcardas pelo empregado, devem estar previstas em contrato escrito. O STT orienta que a transferência irrestrita dos custos do empreendimento para o trabalhador afronta o princípio da alteridade (art. 2º da CLT), segundo o qual os riscos da atividade econômica correm por conta do empregador. Por fim, a saúde e segurança do trabalho ganham novas nuances no ambiente domiciliar. O empregador deve instruir os empregados, de maneira ostensiva e clara, quanto às precauções a tomar a fim de evitar doenças e acidentes de trabalho, colhendo do obreiro um termo de responsabilidade no qual este se compromete a seguir as instruções fornecidas. A intersecção entre o direito à desconexão, a ergonomia e a saúde mental firma-se, portanto, como a fronteira mais sensível da tutela do teletrabalho no século XXI."

            {
                id: "coletanea_constitucional_politicas_publicas",
                category: "Direito Constitucional",
                title: "Judicialização e Políticas Públicas",
                text: "O fenômeno da judicialização da política e das políticas públicas tornou-se uma marca indelével do constitucionalismo brasileiro contemporâneo. Diante da promulgação da Carta Cidadã de 1988, caracterizada por um texto prolixo, analítico e dogmaticamente compromissado com a efetivação de direitos fundamentais sociais, o Poder Judiciário — com destaque para o Supremo Tribunal Federal (STF) — assumiu papel protagonista na concretização das promessas constitucionais negligenciadas ou diferidas pelos Poderes Executivo e Legislativo. A jurisdição constitucional ostenta a nobre função de garantir a supremacia da Constituição e proteger as minorias contra os eventuais excessos das maiorias contratuais. O controle de constitucionalidade, seja na modalidade difusa ou concentrada (por meio de ADI, ADC, ADO e ADPF), não se limita a expurgar do ordenamento as leis manifestamente incompatíveis com o texto supremo, mas atua com frequência mandamental, impondo aos órgãos estatais obrigações de fazer no âmbito das políticas públicas essenciais, como saúde, educação e sistema prisional. Entretanto, essa atuação gera tensões dialéticas com o Princípio da Separação dos Poderes (art. 2º da CF/88). Argumenta-se que a intervenção judicial em matérias que exigem alocação de recursos orçamentários carece de legitimidade democrática, uma vez que os magistrados não são eleitos pelo voto popular e não possuem a visão global do erário que ostentam os gestores públicos. Contrapõe-se a tese da \"Reserva do Possível\", segundo a qual a efetivação dos direitos sociais está condicionada à disponibilidade financeira do Estado e à previsão orçamentária prévia. A jurisprudência do STF consolidou a superação do dogma da intangibilidade absoluta das escolhas trágicas do Executivo ao fixar o conceito do \"Mínimo Existencial\". Compreendido como o conjunto de condições materiais indispensáveis a uma vida digna (incluindo saúde básica, ensino fundamental, alimentação e moradia), o mínimo existencial afasta a alegação da reserva do possível, autorizando o Judiciário a determinar o fornecimento de medicamentos de alto custo, a abertura de vagas em creches ou a reforma de unidades prisionais insalubres. Para contornar o risco do arbítrio judicial e da desestruturação do orçamento estatal, a Suprema Corte vem aperfeiçoando mecanismos de diálogo institucional e de jurisdição concertada. A realização de audiências públicas com especialistas e membros da sociedade civil, a fixação de teses operacionais com repercussão geral e a edição de decisões estruturantes no âmbito da Arguição de Descumprimento de Preceito Fundamental (como o reconhecimento do \"Estado de Coisas Inconstitucional\" no sistema penitenciário) exemplificam essa abordagem contemporânea. Dessa forma, o controle constitucional sobre políticas públicas não deve ser compreendido como uma usurpação de competência executiva, mas sim como uma atuação corretiva indispensável para combater a omissão inconstitucional do Estado. A atuação jurisdicional contida e pautada na razoabilidade garante que o compromisso constitucional com a dignidade humana não se transforme em mera carta de intenções desprovida de eficácia jurídica."

                title: "Elisão, Evasão e Planejamento Tributário",
                text: "O Planejamento Tributário configura-se como o conjunto de condutas lícitas adotadas pelo contribuinte com o objetivo de estruturar seus negócios de forma a reduzir, diferir ou eliminar a incidência de tributos. Em um país marcado por uma das cargas tributárias mais elevadas e complexas do mundo, como o Brasil, a busca por meios legais de otimização fiscal constitui não apenas um direito indiscutível do cidadão e das empresas, mas uma imperiosa exigência de gestão e sobrevivência no mercado globalizado. A doutrina tributária delimita com clareza conceitual a distinção entre elisão fiscal e evasão fiscal. A elisão fiscal (ou planejamento lícito) ocorre mediante a prática de atos ou negócios jurídicos estruturados antes da ocorrência do fato gerador do tributo. O contribuinte opta pela via jurídica menos onerosa dentre as alternativas legalmente franqueadas pelo legislador, valendo-se das lacunas ou de incentivos da própria legislação para economizar recursos de forma hígida. Em contraposição, a evasão fiscal (ou sonegação) caracteriza-se como uma conduta ilícita praticada após ou concomitantemente à ocorrência do fato gerador. Nela, o contribuinte oculta a realidade fática, altera informações prestadas ao Fisco ou utiliza documentos falsos para fraudar a obrigação tributária principal. Trata-se de ilícito administrativo que, a depender das circunstâncias, descamba para a esfera penal, tipificando os crimes contra a ordem tributária previstos na Lei nº 8.137/1990. A zona cinzenta das discussões tributárias reside na figura da elisão ineficaz ou dissimulada, frequentemente tratada no âmbito da norma antielisão inserida no parágrafo único do art. 116 do Código Tributário Nacional (CTN). Tal dispositivo faculta à autoridade administrativa desconsiderar atos ou negócios jurídicos praticados com a finalidade de dissimular a ocorrência do fato gerador do tributo ou a natureza dos elementos constitutivos da obrigação tributária. O Conselho Administrativo de Recursos Fiscais (CARF) e os Tribunais Pátrios vêm adotando o critério do \"propósito alimentar\" ou \"propósito negocial\" para averiguar a legitimidade dos planejamentos tributários sofisticados (como reestruturações societárias, fusões, cisões e reorganizações com uso de ágio). Sob esse prisma, o negócio jurídico praticado sem qualquer motivação extratributária ou econômica real — visando unicamente à criação de uma forma jurídica artificial para burlar o Fisco — pode ser desconsiderado para fins fiscais, cobrando-se o imposto devido acompanhado das penalidades cabíveis. Em conclusão, o planejamento tributário hígido pressupõe a observância da substância econômica dos atos, da transparência e da anterioridade ao fato gerador. A superação dos excessos por parte da administração fiscal e o respeito às garantias do contribuinte constituem o ponto de equilíbrio essencial para a preservação da segurança jurídica no sistema tributário nacional."
            }];

        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playKey(isError = false) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (isError) {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.08);
                    } else {
                        osc.type = 'sine';
                        const pitch = 480 + Math.random() * 220;
                        osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.04);
                    }
                } catch(e) {}
            }
        }

        const soundEngine = new SoundEngine();

        function App() {
            // Configurações do teste
            const [selectedPreset, setSelectedPreset] = useState(LEGAL_PRESETS[0]);
            const [targetText, setTargetText] = useState(LEGAL_PRESETS[0].text);
            const [timeMode, setTimeMode] = useState(60); // em segundos, 0 = livre
            const [soundActive, setSoundActive] = useState(true);

            // Estado para tempo personalizado
            const [isCustomTimeModalOpen, setIsCustomTimeModalOpen] = useState(false);
            const [customMinutesInput, setCustomMinutesInput] = useState('2');
            const [customSecondsInput, setCustomSecondsInput] = useState('0');

            // Estado de Digitação
            const [userInput, setUserInput] = useState('');
            const [isStarted, setIsStarted] = useState(false);
            const [isFinished, setIsFinished] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [timeElapsed, setTimeElapsed] = useState(0); // em segundos
            const [errorCountHistory, setErrorCountHistory] = useState(0);
// Texto Personalizado Colado pelo Usuário
            const [isCustomModalOpen, setIsCustomModalOpen] = useState(false);
            const [customPastedText, setCustomPastedText] = useState('');

            // Quantidade personalizada de caracteres para o treino
            const [targetCharCount, setTargetCharCount] = useState(600);
            const [isCharCountModalOpen, setIsCharCountModalOpen] = useState(false);
            const [customCharCountInput, setCustomCharCountInput] = useState('600');


            // Histórico local
            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('redigitacao_history') || localStorage.getItem('juritype_history');
                return saved ? JSON.parse(saved) : [];
            });

            // Refs
            const inputRef = useRef(null);
            const timerRef = useRef(null);
            const textContainerRef = useRef(null);
            const cursorRef = useRef(null);

            useEffect(() => {
                soundEngine.enabled = soundActive;
            }, [soundActive]);

            // Corta o texto no tamanho solicitado, preferindo terminar em uma palavra inteira
            const applyCharacterLimit = (text, limit) => {
                if (!text) return '';
                if (!limit || limit <= 0 || text.length <= limit) return text;
                let sliced = text.slice(0, limit);
                const lastSpace = sliced.lastIndexOf(' ');
                if (lastSpace > limit * 0.5) {
                    sliced = sliced.slice(0, lastSpace);
                }
                return sliced.trim();
            };

            // Atualiza texto quando seleciona novo preset
            const handleSelectPreset = (preset) => {
      clearInterval(timerRef.current);
      setSelectedPreset(preset);
      const text = applyCharacterLimit(preset.text, targetCharCount);
      setTargetText(text);
      setUserInput('');
      setIsStarted(false);
      setIsFinished(false);
      setTimeElapsed(0);
      setErrorCountHistory(0);
      if (inputRef.current) {
        inputRef.current.value = '';
        inputRef.current.focus();
      }
    };

            // Handler para carregar texto personalizado colado
            const handleApplyCustomText = () => {
                const trimmed = customPastedText.trim();
                if (!trimmed) return;

                const customPreset = {
                    id: 'custom_' + Date.now(),
                    category: 'Personalizado',
                    title: `Texto Colado (${trimmed.length} chars)`,
                    text: trimmed
                };

                setSelectedPreset(customPreset);
                setTargetText(applyCharacterLimit(trimmed, targetCharCount));
                setIsCustomModalOpen(false);
                resetTest();
            };

            // Aplica a quantidade personalizada de caracteres
            const handleApplyCharCount = () => {
                const count = parseInt(customCharCountInput, 10);
                if (!Number.isFinite(count) || count < 1) return;

                setTargetCharCount(count);

                const adjustedText = applyCharacterLimit(selectedPreset.text, count);
                setTargetText(adjustedText);
                setIsCharCountModalOpen(false);
                resetTest();
            };

            // Handler para aplicar tempo personalizado inserido pelo usuário
            const handleApplyCustomTime = () => {
                const mins = parseInt(customMinutesInput, 10) || 0;
                const secs = parseInt(customSecondsInput, 10) || 0;
                const totalSeconds = mins * 60 + secs;

                if (totalSeconds >= 0) {
                    setTimeMode(totalSeconds);
                    setIsCustomTimeModalOpen(false);
                    resetTest();
                }
            };

            // Resetar Teste
            const resetTest = useCallback(() => {
                clearInterval(timerRef.current);
                setUserInput('');
                setIsStarted(false);
                setIsFinished(false);
                setIsPaused(false);
                setTimeElapsed(0);
                setErrorCountHistory(0);
                if (inputRef.current) {
                    inputRef.current.value = '';
                    inputRef.current.focus();
                }
            }, []);

            // Pausar / Retomar o treino
            const togglePause = useCallback(() => {
                if (!isStarted || isFinished) return;
                setIsPaused(prev => {
                    const next = !prev;
                    if (!next && inputRef.current) {
                        // Ao retomar, devolve o foco para o campo de digitação
                        setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
                    }
                    return next;
                });
            }, [isStarted, isFinished]);

            // Cronômetro
            useEffect(() => {
                if (isStarted && !isFinished && !isPaused) {
                    timerRef.current = setInterval(() => {
                        setTimeElapsed(prev => {
                            const next = prev + 1;
                            if (timeMode > 0 && next >= timeMode) {
                                finishTest();
                            }
                            return next;
                        });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }

                return () => clearInterval(timerRef.current);
            }, [isStarted, isFinished, isPaused, timeMode]);

            // Auto scroll do cursor dentro da caixa de texto maior
            useEffect(() => {
                if (cursorRef.current && textContainerRef.current) {
                    const cursorTop = cursorRef.current.offsetTop;
                    const containerHeight = textContainerRef.current.clientHeight;
                    textContainerRef.current.scrollTop = cursorTop - containerHeight / 2;
                }
            }, [userInput]);

            const finishTest = useCallback(() => {
                setIsFinished(true);
                setIsStarted(false);
                clearInterval(timerRef.current);

                if (window.confetti) {
                    window.confetti({
                        particleCount: 90,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            }, []);

            // Salvar no histórico quando finaliza
            useEffect(() => {
                if (isFinished && timeElapsed > 0) {
                    const stats = computeMetrics();
                    const newEntry = {
                        id: Date.now(),
                        date: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
                        title: selectedPreset.title,
                        cpmLiquido: stats.cpmLiquido,
                        ppmLiquida: stats.ppmLiquida,
                        certos: stats.certos,
                        errados: stats.errados,
                        liquidos: stats.liquidos,
                        precisao: stats.precisao,
                        minutos: stats.minutosFormatted,
                        totalChars: targetText.length
                    };
                    const updated = [newEntry, ...history.slice(0, 19)];
                    setHistory(updated);
                    localStorage.setItem('redigitacao_history', JSON.stringify(updated));
                }
            }, [isFinished]);

            // Cálculo detalhado das Métricas Solicitadas (Certos, Errados, Líquidos e Minutos)
            const computeMetrics = useCallback(() => {
                const targetChars = targetText.split('');
                const inputChars = userInput.split('');

                let certos = 0;
                let errados = 0;

                inputChars.forEach((char, index) => {
                    if (index < targetChars.length) {
                        if (char === targetChars[index]) {
                            certos++;
                        } else {
                            errados++;
                        }
                    }
                });

                // Caracteres Líquidos = Certos - Errados (não negativo)
                const liquidos = Math.max(0, certos - errados);
                
                // Minutos transcorridos (mínimo de 0.001 para evitar divisão por zero)
                const minutos = Math.max(timeElapsed / 60, 0.0001);

                // CPM e PPM Líquidos
                const cpmBruto = Math.round(inputChars.length / minutos);
                const cpmLiquido = Math.round(liquidos / minutos);
                
                const ppmBruta = Math.round((inputChars.length / 5) / minutos);
                const ppmLiquida = Math.round((liquidos / 5) / minutos);

                // Precisão %
                const totalDigitados = certos + errados;
                const precisao = totalDigitados > 0 ? Math.round((certos / totalDigitados) * 100) : 100;

                return {
                    certos,
                    errados,
                    liquidos,
                    cpmBruto,
                    cpmLiquido,
                    ppmBruta,
                    ppmLiquida,
                    precisao,
                    minutosFormatted: minutos.toFixed(2),
                    totalDigitados
                };
            }, [userInput, targetText, timeElapsed]);

            const stats = computeMetrics();

            // Handler de entrada de digitação
            const handleInputChange = (e) => {
                const val = e.target.value;

                if (!isStarted && val.length > 0) {
                    setIsStarted(true);
                }

                if (isFinished) return;

                if (isPaused) {
                    // Ignora digitação enquanto pausado; mantém o campo alinhado ao progresso salvo
                    if (inputRef.current) inputRef.current.value = userInput;
                    return;
                }

                // Som e detecção de erros
                const lastTypedIndex = val.length - 1;
                if (lastTypedIndex >= 0 && lastTypedIndex < targetText.length) {
                    const isCorrect = val[lastTypedIndex] === targetText[lastTypedIndex];
                    soundEngine.playKey(!isCorrect);
                    if (!isCorrect && val.length > userInput.length) {
                        setErrorCountHistory(prev => prev + 1);
                    }
                }

                setUserInput(val);

                // Auto-finalização
                if (val.length >= targetText.length) {
                    finishTest();
                }
            };

            // Titulação Jurídica por Velocidade
            const getJuristRank = (wpm) => {
                if (wpm >= 80) return { title: 'Ministro do STF da Digitação', color: 'text-amber-400', badge: 'bg-amber-500/20 border-amber-500/50' };
                if (wpm >= 60) return { title: 'Desembargador da Velocidade', color: 'text-yellow-400', badge: 'bg-yellow-500/20 border-yellow-500/50' };
                if (wpm >= 45) return { title: 'Juiz de Direito Sênior', color: 'text-emerald-400', badge: 'bg-emerald-500/20 border-emerald-500/50' };
                if (wpm >= 30) return { title: 'Advogado Pleno', color: 'text-cyan-400', badge: 'bg-cyan-500/20 border-cyan-500/50' };
                if (wpm >= 15) return { title: 'Analista Judiciário', color: 'text-blue-400', badge: 'bg-blue-500/20 border-blue-500/50' };
                return { title: 'Estagiário de Direito', color: 'text-slate-400', badge: 'bg-slate-500/20 border-slate-500/50' };
            };

            const nextChar = useMemo(() => {
                if (userInput.length < targetText.length) {
                    return targetText[userInput.length];
                }
                return '';
            }, [userInput, targetText]);

            return (
                <div className="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
                    {/* Header Principal */}
                    <header className="flex flex-col md:flex-row justify-between items-center gap-4 pb-6 border-b border-slate-800">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-slate-950 text-2xl font-bold shadow-lg shadow-amber-500/20">
                                <i className="fa-solid fa-scale-balanced"></i>
                            </div>
                            <div>
                                <h1 className="font-serif text-2xl sm:text-3xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500">
                                    JuriType
                                </h1>
                                <p className="text-xs sm:text-sm text-slate-400">
                                    Treinamento e Análise de Digitação
                                </p>
                            </div>
                        </div>

                        {/* Modos e Controles Rápidos */}
                        <div className="flex flex-wrap items-center justify-center gap-2 sm:gap-3 bg-slate-900/80 p-2 rounded-2xl border border-slate-800 backdrop-blur-md">
                            <button
                                onClick={() => setSoundActive(!soundActive)}
                                className={`px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2 ${
                                    soundActive 
                                        ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' 
                                        : 'text-slate-400 hover:text-slate-200'
                                }`}
                                title="Alternar som do teclado"
                            >
                                <i className={`fa-solid ${soundActive ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                                <span className="hidden sm:inline">Efeitos Sonoros</span>
                            </button>

                            <div className="h-4 w-px bg-slate-800"></div>

                            {/* Quantidade de caracteres */}
                            <button
                                onClick={() => {
                                    setCustomCharCountInput(String(targetCharCount));
                                    setIsCharCountModalOpen(true);
                                }}
                                className="px-2.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1 border border-slate-700/50 text-slate-400 hover:text-slate-100 hover:bg-slate-800"
                                title="Configurar quantidade de caracteres"
                            >
                                <i className="fa-solid fa-text-width text-[10px]"></i>
                                <span>{targetCharCount} ch</span>
                            </button>

                            <div className="h-4 w-px bg-slate-800"></div>

                            {/* Seleção de Tempo Ampliada de 30s até 6 min e Modo Customizado */}
                            <div className="flex flex-wrap items-center gap-1">
                                {[
                                    { label: '30s', val: 30 },
                                    { label: '1m', val: 60 },
                                    { label: '2m', val: 120 },
                                    { label: '3m', val: 180 },
                                    { label: '4m', val: 240 },
                                    { label: '5m', val: 300 },
                                    { label: '6m', val: 360 },
                                    { label: 'Livre', val: 0 }
                                ].map(m => (
                                    <button
                                        key={m.val}
                                        onClick={() => { setTimeMode(m.val); resetTest(); }}
                                        className={`px-2.5 py-1.5 rounded-xl text-xs font-semibold transition ${
                                            timeMode === m.val 
                                                ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/20' 
                                                : 'text-slate-400 hover:text-slate-100 hover:bg-slate-800'
                                        }`}
                                    >
                                        {m.label}
                                    </button>
                                ))}

                                <button
                                    onClick={() => setIsCustomTimeModalOpen(true)}
                                    className={`px-2.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1 ${
                                        ![30, 60, 120, 180, 240, 300, 360, 0].includes(timeMode)
                                            ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/20'
                                            : 'text-slate-400 hover:text-slate-100 hover:bg-slate-800 border border-slate-700/50'
                                    }`}
                                    title="Configurar tempo personalizado"
                                >
                                    <i className="fa-solid fa-stopwatch text-[10px]"></i>
                                    <span>
                                        {![30, 60, 120, 180, 240, 300, 360, 0].includes(timeMode) 
                                            ? `${Math.floor(timeMode / 60)}m ${timeMode % 60}s` 
                                            : 'Outro'}
                                    </span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Conteúdo Central */}
                    <main className="my-6 space-y-6">
                        
                        {/* Seletor de Textos & Gerador IA */}
                        <div className="grid grid-cols-1 gap-4">
                            
                            {/* Lista de Textos Jurídicos */}
                            <div className="bg-slate-900/50 border border-slate-800 rounded-2xl p-4 backdrop-blur-sm">
                                <div className="flex items-center justify-between mb-3">
                                    <span className="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                                        <i className="fa-solid fa-book-bookmark"></i> Acervo Forense — Textos Jurídicos
                                    </span>
                                    <div className="flex items-center gap-3">
                                        {}
                                        <button
                                            onClick={() => setIsCustomModalOpen(true)}
                                            className="px-3 py-1 bg-amber-500/10 border border-amber-500/40 hover:bg-amber-500/20 text-amber-300 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-sm"
                                        >
                                            <i className="fa-solid fa-paste"></i> Colar Texto
                                        </button>
                                        <span className="text-xs text-slate-400 font-mono hidden sm:inline">
                                            Tam. Atual: <strong className="text-amber-300">{targetText.length}</strong> chars
                                        </span>
                                    </div>
                                </div>
                                <div className="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                                    {LEGAL_PRESETS.map(preset => (
                                        <button
                                            key={preset.id}
                                            onClick={() => handleSelectPreset(preset)}
                                            className={`px-4 py-2.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all border flex flex-col text-left gap-0.5 min-w-[200px] ${
                                                selectedPreset.id === preset.id

                                                    : 'bg-slate-800/40 border-slate-700/50 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between w-full">
                                                <span className="text-[10px] text-amber-400 font-semibold">{preset.category}</span>
                                                <span className="text-[9px] px-1.5 py-0.2 rounded bg-slate-950/80 text-slate-400 font-mono">
                                                    {preset.text.length} ch
                                                </span>
                                            </div>
                                            <span className="font-semibold text-slate-200 truncate max-w-[190px]">{preset.title}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                        </div>

                        {/* Painel Solicitado: Certos, Errados, Líquidos e Minutos */}
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                            
                            {/* Caracteres Certos */}
                            <div className="bg-slate-900/80 border border-emerald-500/30 rounded-2xl p-3.5">
                                <div className="text-[11px] font-semibold text-emerald-400 uppercase tracking-wider flex items-center justify-between">
                                    <span>Certos</span>
                                    <i className="fa-solid fa-circle-check text-emerald-500/40"></i>
                                </div>
                                <div className="text-2xl sm:text-3xl font-extrabold text-emerald-400 mt-1 font-mono">
                                    {stats.certos}
                                </div>
                                <div className="text-[10px] text-slate-400 mt-0.5">Caracteres acertos</div>
                            </div>

                            {/* Caracteres Errados */}
                            <div className="bg-slate-900/80 border border-rose-500/30 rounded-2xl p-3.5">
                                <div className="text-[11px] font-semibold text-rose-400 uppercase tracking-wider flex items-center justify-between">
                                    <span>Errados</span>
                                    <i className="fa-solid fa-circle-xmark text-rose-500/40"></i>
                                </div>
                                <div className="text-2xl sm:text-3xl font-extrabold text-rose-400 mt-1 font-mono">
                                    {stats.errados}
                                </div>

                            </div>

                            {/* Caracteres Líquidos (Destaque Dourado) */}
                            <div className="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-3.5 relative overflow-hidden glow-gold bg-gradient-to-br from-amber-500/10 to-transparent">
                                <div className="text-[11px] font-semibold text-amber-400 uppercase tracking-wider flex items-center justify-between">
                                    <span>Líquidos</span>
                                    <i className="fa-solid fa-calculator text-amber-400"></i>
                                </div>
                                <div className="text-2xl sm:text-3xl font-extrabold text-amber-300 mt-1 font-mono">
                                    {stats.liquidos}
                                </div>
                                <div className="text-[10px] text-amber-300/80 mt-0.5 font-medium">Certos − Errados</div>
                            </div>

                            {/* Minutos e Tempo Decorrido */}

                                    let isCurrent = false;

                                    if (index < userInput.length) {
                                        if (userInput[index] === char) {
                                            styleClass = 'text-emerald-400 bg-emerald-500/10 font-medium'; // Certos
                                        } else {
                                            styleClass = 'text-rose-400 bg-rose-500/25 font-bold underline decoration-rose-500'; // Errados
                                        }

                                        styleClass = 'text-amber-300 bg-amber-500/20 border-b-2 border-amber-400 font-bold'; // Cursors
                                    }

                                    return (
                                        <span 
                                            key={index}

                                        <i className="fa-solid fa-rotate-right"></i> Iniciar Novo Treino
                                    </button>
                                </div>
                            </div>

                        {/* Modal para Colar Texto Personalizado */}

                        {/* Histórico Local de Desempenho */}

                                                    <td className="py-2.5 text-center text-cyan-400 font-bold">{item.ppmLiquida}</td>
                                                    <td className="py-2.5 text-center text-slate-400">{item.totalChars || 750} ch</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Rodapé e Guia de Fórmulas */}
                    <footer className="pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-3">
                        <div className="flex items-center gap-2">
                            <span className="font-serif font-bold text-amber-400">Re.Digitação</span>
                            <span>• Treino Jurídico com Textos de 600 a 1000 Caracteres</span>
                        </div>
                        <div className="flex items-center gap-4 text-[11px] font-mono">
                            <span><b>Líquidos</b> = Certos − Errados</span>
                            <span><b>Minutos</b> = Segundos ÷ 60</span>
                            <span><b>PPM Líq.</b> = (Líquidos ÷ 5) ÷ Minutos</span>
                        </div>
                    </footer>
                </div>
            );
        }

        // Renderização do React
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
